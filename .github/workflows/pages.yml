name: Deploy Command Center to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
        env: { DASHBOARD_BASE: '/${{ github.event.repository.name }}/' }
      - run: cp dashboard/dist/index.html dashboard/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dashboard/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
